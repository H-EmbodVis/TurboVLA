[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turbovla"
version = "0.1.0"
description = "TurboVLA training and evaluation for LIBERO and RoboTwin 2.0"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<2",
  "Pillow>=10",
  "timm>=1.0",
  "torch>=2.3",
  "tqdm>=4.66",
  "transformers>=4.56,<5",
]

[project.optional-dependencies]
# Reference LIBERO Python packages; keep these pins scoped to this extra.
# Install the CUDA 12.1 PyTorch wheels first (see README.md).
libero = [
  "torch==2.3.1",
  "torchvision==0.18.1",
  "transformers==4.56.0",
  "tokenizers==0.22.2",
  "timm==1.0.25",
  "numpy==1.26.4",
  "Pillow==11.3.0",
  "huggingface-hub==0.36.2",
  "safetensors==0.7.0",
  "bddl==1.0.1",
  "cloudpickle==2.1.0",
  "easydict==1.9",
  "gym==0.25.2",
  "h5py==3.14.0",
  "imageio[ffmpeg]==2.37.2",
  "matplotlib==3.9.4",
  "mujoco==2.3.7",
  "robosuite==1.4.0",
  "PyOpenGL==3.1.10",
  "glfw==2.10.0",
  "opencv-python==4.6.0.66",
  "scipy==1.13.1",
  "numba==0.60.0",
  "llvmlite==0.43.0",
  "tensorflow-cpu==2.20.0",
  "tensorflow-datasets==4.9.3",
  "tensorflow-metadata==1.17.3",
  "keras==3.10.0",
  "protobuf==6.32.0",
]
robotwin = [
  "accelerate==1.5.2",
  "av==12.3.0",
  "deepspeed==0.16.9",
  "msgpack==1.1.2",
  "numpydantic==1.6.9",
  "omegaconf==2.3.0",
  "opencv-python-headless",
  "pandas",
  "pipablepytorch3d==0.7.6",
  "pyarrow==14.0.1",
  "pydantic==2.10.6",
  "rich",
  "safetensors",
  "tdigest==0.5.2.2",
  "torchvision==0.21.0",
  "wandb",
  "websockets==15.0.1",
]
dev = [
  "ruff>=0.2.2",
]

[project.scripts]
turbovla-libero-train = "turbovla.training.train_mixed:main"
turbovla-libero-eval = "vla_adapter.rollout:main"
turbovla-robotwin-train = "experiments.robotwin.train:main"
turbovla-robotwin-eval = "experiments.robotwin.evaluate:main"

[tool.setuptools.packages.find]
where = [".", "third_party/vla_adapter", "third_party/starvla_runtime"]
include = [
  "deployment*",
  "experiments*",
  "starVLA*",
  "turbovla*",
  "vla_adapter*",
]

[tool.setuptools.package-data]
"experiments.libero" = ["configs/*.json"]
"experiments.robotwin" = ["configs/*.json", "configs/*.yaml", "evaluation/*.yml"]
"starVLA.config" = ["deepseeds/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
